<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
<title>Conectarea GY-87 cu VCC_IN și pin separat 3.3V la Raspberry Pi 5</title>
<desc>Alimentare Raspberry Pi 5V pin 2 la VCC_IN GY-87, GND comun; SDA pin 3, SCL pin 5 numai după verificarea nivelurilor I2C. Pinul 3.3V de pe GY-87 rămâne neconectat.</desc>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#152638}.h{font-size:27px;font-weight:700}.s{font-size:17px;font-weight:600}.sm{font-size:15px}.board{fill:#ecf4ee;stroke:#236347;stroke-width:3}.module{fill:#e9f0fa;stroke:#24578c;stroke-width:3}.pin{fill:#fff;stroke:#526579;stroke-width:2}.wire{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#d13a39}.green{stroke:#238252}.blue{stroke:#2674c8}.gray{stroke:#5e6674}.box{fill:#fff9ef;stroke:#d4ab65;stroke-width:1.5}.alert{fill:#a14b10}.nc{stroke:#b16a12;stroke-width:4;stroke-linecap:round}
</style>
<rect width="1120" height="660" fill="#fff"/>
<text class="t h" x="48" y="54">Raspberry Pi 5 ↔ GY-87</text>
<text class="t sm" x="48" y="85">Numai pentru GY-87 cu regulator pe VCC_IN și pin 3.3V separat</text>
<rect class="board" x="50" y="126" width="420" height="393" rx="20"/>
<text class="t h" x="85" y="177">Raspberry Pi 5</text>
<text class="t sm" x="85" y="204">Header GPIO 40 pini</text>
<rect class="module" x="780" y="126" width="290" height="393" rx="20"/>
<text class="t h" x="845" y="177">GY-87</text>
<text class="t sm" x="823" y="204">MPU6050 + BMP180</text>
<!-- Power, I2C, ground -->
<path class="wire red" d="M430 260 H820"/>
<path class="wire blue" d="M430 320 H820"/>
<path class="wire green" d="M430 380 H820"/>
<path class="wire gray" d="M430 440 H820"/>
<circle class="pin" cx="430" cy="260" r="11"/><circle class="pin" cx="820" cy="260" r="11"/>
<circle class="pin" cx="430" cy="320" r="11"/><circle class="pin" cx="820" cy="320" r="11"/>
<circle class="pin" cx="430" cy="380" r="11"/><circle class="pin" cx="820" cy="380" r="11"/>
<circle class="pin" cx="430" cy="440" r="11"/><circle class="pin" cx="820" cy="440" r="11"/>
<text class="t s" x="80" y="266">5 V — pin fizic 2 (sau 4)</text>
<text class="t s" x="80" y="326">GPIO2 / SDA1 — pin 3</text>
<text class="t s" x="80" y="386">GPIO3 / SCL1 — pin 5</text>
<text class="t s" x="80" y="446">GND — pin 6</text>
<text class="t s" x="850" y="266">VCC_IN</text>
<text class="t s" x="850" y="326">SDA*</text>
<text class="t s" x="850" y="386">SCL*</text>
<text class="t s" x="850" y="446">GND</text>
<!-- Regulator 3.3 V output: no connection to Raspberry Pi -->
<circle class="pin" cx="820" cy="490" r="11"/>
<path class="nc" d="M775 490 H808 M765 478 L785 502 M785 478 L765 502"/>
<text class="t s" x="848" y="496">3.3V — liber</text>
<text class="t sm alert" x="548" y="496">NU conectați!</text>
<rect class="box" x="50" y="535" width="1020" height="107" rx="12"/>
<text class="t s" x="70" y="562">Alimentare: 5 V (Raspberry Pi) → VCC_IN (GY-87); pinul 3.3V al GY-87 rămâne liber.</text>
<text class="t sm" x="70" y="590">* SDA/SCL se conectează numai după verificarea tensiunii HIGH și a pull-up-urilor: maximum 3,3 V.</text>
<text class="t sm" x="70" y="617">Dacă nivelurile sunt peste 3,3 V: nu conectați direct la GPIO; folosiți conversie de nivel I²C.</text>
</svg>