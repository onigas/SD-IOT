<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#152638}.h{font-size:27px;font-weight:700}.s{font-size:17px;font-weight:600}.sm{font-size:15px}.tiny{font-size:13px}.board{fill:#ecf4ee;stroke:#236347;stroke-width:3}.module{fill:#e9f0fa;stroke:#24578c;stroke-width:3}.pin{fill:white;stroke:#526579;stroke-width:2}.wire{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#d13a39}.green{stroke:#238252}.blue{stroke:#2674c8}.gray{stroke:#5e6674}.dash{stroke:#ce8d24;stroke-width:4;stroke-dasharray:8 8}.box{fill:#fff;stroke:#d4e0e9;stroke-width:1.5}</style>
<rect width="1120" height="640" fill="#fff"/><text class="t h" x="48" y="58">Raspberry Pi 5 ↔ GY-87</text><text class="t sm" x="48" y="88">Interfață I²C — SDA, SCL și GND</text>
<rect class="board" x="50" y="140" width="420" height="365" rx="20"/><text class="t h" x="85" y="198">Raspberry Pi 5</text><text class="t sm" x="85" y="226">Header GPIO 40 pini</text>
<rect class="module" x="780" y="140" width="290" height="365" rx="20"/><text class="t h" x="845" y="198">GY-87</text><text class="t sm" x="823" y="226">MPU6050 + BMP180</text>
<path class="wire blue" d="M430 280 H820"/><path class="wire green" d="M430 350 H820"/><path class="wire gray" d="M430 420 H820"/>
<circle class="pin" cx="430" cy="280" r="11"/><circle class="pin" cx="820" cy="280" r="11"/><circle class="pin" cx="430" cy="350" r="11"/><circle class="pin" cx="820" cy="350" r="11"/><circle class="pin" cx="430" cy="420" r="11"/><circle class="pin" cx="820" cy="420" r="11"/>
<text class="t s" x="80" y="286">GPIO2 / SDA1 — pin 3</text><text class="t s" x="80" y="356">GPIO3 / SCL1 — pin 5</text><text class="t s" x="80" y="426">GND — pin 6</text>
<text class="t s" x="850" y="286">SDA</text><text class="t s" x="850" y="356">SCL</text><text class="t s" x="850" y="426">GND</text>
<rect class="box" x="50" y="529" width="1020" height="88" rx="12"/><text class="t s" x="70" y="555">Alimentare GY-87: conectați separat, conform reviziei modulului existent.</text><text class="t sm" x="70" y="579">Unele variante au VCC_IN și pin 3.3V distinct; nu le considerați echivalente.</text><text class="t sm" x="70" y="601">Verificați nivelurile SDA/SCL: intrările Raspberry Pi acceptă maximum 3,3 V.</text>
</svg>